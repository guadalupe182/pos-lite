<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POS-lite · Packs</title>
    <style>
        body { font-family: system-ui, sans-serif; margin:16px; }
        .card { border:1px solid #eee; border-radius:12px; padding:12px; margin-bottom:12px; }
        input, button { padding:6px 10px; font-size:14px; }
        table { border-collapse:collapse; width:100%; margin-top:8px; }
        th, td { border:1px solid #ddd; padding:4px 6px; font-size:13px; }
        .ok { color:#0a0; }
        .err { color:#b00; }
        .muted { color:#666; font-size:12px; }
    </style>
</head>
<body>
<h1>POS-lite · Gestión de Packs</h1>

<div class="card">
    <strong>Credenciales API (Basic Auth)</strong><br/>
    <input id="user" placeholder="usuario" autocomplete="username" />
    <input id="pass" placeholder="contraseña" type="password" autocomplete="current-password" />
    <button id="save">Guardar</button>
    <span id="authState"></span>
</div>

<div class="card">
    <h3>Datos del pack</h3>
    <label>Barcode del pack<br>
        <input id="pk_barcode" placeholder="Ej. 1234567890123" style="width:240px;">
    </label><br><br>

    <label>Nombre del pack<br>
        <input id="pk_name" placeholder="Ej. Rexona Clinical x 50" style="width:240px;">
    </label><br><br>

    <label>Precio del pack<br>
        <input id="pk_price" type="number" step="0.01" min="0" value="0">
    </label>
</div>

<div class="card">
    <h3>Agregar productos al pack</h3>
    <div class="muted">1) Escanea o escribe el <b>barcode del producto unitario</b>, 2) indica cuántas piezas trae el pack y 3) presiona "Agregar".</div>
    <br>
    <label>Barcode producto<br>
        <input id="pr_barcode" placeholder="Barcode producto" style="width:200px;">
        <button id="pr_find" type="button">Buscar producto</button>
    </label>
    <div id="pr_info" class="muted"></div>
    <br>
    <label>Piezas de este producto por pack<br>
        <input id="pr_qty" type="number" min="1" value="1" style="width:80px;">
    </label>
    <button id="pr_add" type="button">Agregar al pack</button>

    <table id="items_tbl" style="display:none;">
        <thead>
        <tr>
            <th>Producto ID</th>
            <th>Nombre</th>
            <th>Piezas por pack</th>
            <th></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <button id="pk_save" type="button">Guardar pack</button>
    <span id="pk_msg"></span>
</div>

<pre id="debug" class="card" style="background:#111;color:#0f0;max-height:40vh;overflow:auto;">{}</pre>

<script>
    // ====== Auth helpers ======
    const userEl = document.getElementById('user');
    const passEl = document.getElementById('pass');
    const saveBtn = document.getElementById('save');
    const authState = document.getElementById('authState');

    function setAuthState(ok,msg){
      authState.textContent = msg;
      authState.className = ok ? 'ok' : 'err';
    }
    function saveCreds(){
      localStorage.setItem('pos_user', userEl.value.trim());
      localStorage.setItem('pos_pass', passEl.value);
      setAuthState(true,'Guardado');
    }
    function getAuthHeader(){
      const u = localStorage.getItem('pos_user') || '';
      const p = localStorage.getItem('pos_pass') || '';
      if (!u || !p) return null;
      return 'Basic ' + btoa(u + ':' + p);
    }
    (function initCreds(){
      const u = localStorage.getItem('pos_user');
      const p = localStorage.getItem('pos_pass');
      if (u) userEl.value = u;
      if (p) passEl.value = p;
      setAuthState(!!(u && p),(u&&p)?'Listo':'Faltan credenciales');
    })();
    saveBtn.addEventListener('click',saveCreds);

    // ====== UI refs ======
    const pk_barcode = document.getElementById('pk_barcode');
    const pk_name    = document.getElementById('pk_name');
    const pk_price   = document.getElementById('pk_price');
    const pk_msg     = document.getElementById('pk_msg');
    const debug      = document.getElementById('debug');

    const pr_barcode = document.getElementById('pr_barcode');
    const pr_find    = document.getElementById('pr_find');
    const pr_info    = document.getElementById('pr_info');
    const pr_qty     = document.getElementById('pr_qty');
    const pr_add     = document.getElementById('pr_add');

    const itemsTbl   = document.getElementById('items_tbl');
    const itemsTbody = itemsTbl.querySelector('tbody');

    let currentProduct = null;
    let items = []; // { productId, name, quantity }

    function renderItems(){
      if (!items.length){
        itemsTbl.style.display = 'none';
        itemsTbody.innerHTML = '';
        return;
      }
      itemsTbl.style.display = '';
      itemsTbody.innerHTML = items.map((it,idx)=>`
        <tr>
          <td>${it.productId}</td>
          <td>${it.name}</td>
          <td>${it.quantity}</td>
          <td><button data-idx="${idx}" class="btn-del">Quitar</button></td>
        </tr>
      `).join('');

      itemsTbody.querySelectorAll('.btn-del').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const i = parseInt(btn.getAttribute('data-idx'),10);
          items.splice(i,1);
          renderItems();
        });
      });
    }

    // ====== Buscar producto por barcode ======
    pr_find.addEventListener('click', async () => {
      const auth = getAuthHeader();
      if (!auth){ pr_info.textContent='Faltan credenciales'; pr_info.className='err'; return; }

      const code = pr_barcode.value.trim();
      if (!code){ pr_info.textContent='Escribe un barcode'; pr_info.className='err'; return; }

      pr_info.textContent = 'Buscando producto...';
      pr_info.className = 'muted';

      try{
        const r = await fetch('/api/products/barcode/' + encodeURIComponent(code), {
          headers: { 'Accept':'application/json','Authorization':auth }
        });
        if (r.ok){
          const data = await r.json();
          currentProduct = data;
          pr_info.textContent = `Producto: [${data.id}] ${data.name} (stock: ${data.stock})`;
          pr_info.className = 'ok';
          debug.textContent = JSON.stringify(data,null,2);
        } else if (r.status === 404){
          currentProduct = null;
          pr_info.textContent = 'Producto no encontrado (usa Alta rápida en scanner.html primero)';
          pr_info.className = 'err';
        } else {
          currentProduct = null;
          pr_info.textContent = 'Error ' + r.status;
          pr_info.className = 'err';
        }
      }catch(e){
        currentProduct = null;
        pr_info.textContent = 'Error de red';
        pr_info.className = 'err';
      }
    });

    // ====== Agregar producto al pack ======
    pr_add.addEventListener('click', () => {
      if (!currentProduct){
        pr_info.textContent = 'Primero busca un producto válido.';
        pr_info.className = 'err';
        return;
      }
      const qty = Math.max(1, parseInt(pr_qty.value || '1',10));
      const existing = items.find(it=>it.productId === currentProduct.id);
      if (existing){
        existing.quantity = qty; // actualiza cantidad
      } else {
        items.push({
          productId: currentProduct.id,
          name: currentProduct.name,
          quantity: qty
        });
      }
      renderItems();
    });

    // ====== Guardar pack ======
    document.getElementById('pk_save').addEventListener('click', async () => {
      const auth = getAuthHeader();
      if (!auth){ pk_msg.textContent='Faltan credenciales'; pk_msg.className='err'; return; }

      const barcode = pk_barcode.value.trim();
      const name    = pk_name.value.trim();
      const price   = parseFloat(pk_price.value);

      if (!barcode || !name || Number.isNaN(price)){
        pk_msg.textContent = 'Completa barcode, nombre y precio.';
        pk_msg.className = 'err'; return;
      }
      if (!items.length){
        pk_msg.textContent = 'Agrega al menos un producto al pack.';
        pk_msg.className = 'err'; return;
      }

      const body = {
        barcode,
        name,
        price,
        items: items.map(it => ({
          productId: it.productId,
          quantity: it.quantity
        }))
      };

      try{
        const r = await fetch('/api/packs', {
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Accept':'application/json',
            'Authorization':auth
          },
          body: JSON.stringify(body)
        });

        if (r.ok){
          const data = await r.json();
          pk_msg.textContent = '✔ Pack creado correctamente';
          pk_msg.className = 'ok';
          debug.textContent = JSON.stringify(data,null,2);

          // limpiar para otro pack
          items = [];
          renderItems();
          pr_barcode.value = '';
          pr_info.textContent = '';
          pr_qty.value = '1';
        } else if (r.status === 409){
          pk_msg.textContent = 'Ya existe un pack con ese barcode.';
          pk_msg.className = 'err';
          debug.textContent = await r.text();
        } else {
          pk_msg.textContent = 'Error ' + r.status;
          pk_msg.className = 'err';
          debug.textContent = await r.text();
        }
      }catch(e){
        pk_msg.textContent = 'Error de red';
        pk_msg.className = 'err';
        debug.textContent = String(e);
      }
    });
</script>
</body>
</html>
