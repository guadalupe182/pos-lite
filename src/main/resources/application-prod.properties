spring.application.name=POS-LITE-API
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show.sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:pos-lite}
app.jwt.expMinutes=${JWT_EXP_MINUTES:1440}

admin.invite.code=${APP_ADMIN_INVITE_CODE:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Configuración de Email (producción - usar variables de entorno)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Desactivar integración con Eureka (evita reintentos de conexión y fallos en producción)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false