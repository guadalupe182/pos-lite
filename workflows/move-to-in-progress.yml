name: Move Issue to In Progress

on:
  pull_request:
    types: [opened, reopened]

jobs:
  move-to-in-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get issue from PR description
        id: get_issue
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oP '(Closes|Fixes) #\K\d+' | head -1)
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Move issue to In Progress (GraphQL)
        if: steps.get_issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt('${{ steps.get_issue.outputs.issue_number }}');
            if (!issueNumber) return;

            // Obtener el ID del proyecto (Projects V2)
            const projectId = 'PVT_kwDOAEcBZs4AuRVI'; // <-- REEMPLAZA

            // Obtener el ID del issue en el proyecto
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    projectItems(first: 1) {
                      nodes {
                        id
                        fieldValues(first: 10) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                  options {
                                    name
                                    id
                                  }
                                }
                              }
                              optionId
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: issueNumber
            };

            const result = await github.graphql(query, variables);
            const issueNode = result.repository.issue;
            const projectItem = issueNode.projectItems.nodes[0];

            if (!projectItem) {
              console.log('Issue no está en el proyecto. Agregándolo...');
              // Agregar issue al proyecto
              const addMutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item {
                      id
                    }
                  }
                }
              `;
              const addResult = await github.graphql(addMutation, {
                projectId: projectId,
                contentId: issueNode.id
              });
              // Re-obtener el item ID
              // ... (simplificado)
            }

            // Ahora mover a la columna "In Progress"
            // Buscar el ID del campo "Status" y el optionId de "In Progress"
            const statusFieldId = 'PVTF_xxxx'; // ID del campo Status
            const inProgressOptionId = 'xxxx'; // ID de la opción "In Progress"

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(updateMutation, {
              projectId: projectId,
              itemId: projectItem.id,
              fieldId: statusFieldId,
              optionId: inProgressOptionId
            });
