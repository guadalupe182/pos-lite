services:
  pos-lite-db-sandbox:
    image: postgres:15-alpine
    container_name: pos-lite-db-sandbox
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poslite_sandbox_db}
      POSTGRES_USER: ${POSTGRES_USER:-pos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password_segura}
    volumes:
      - poslite_sandbox_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - gdev-sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_user} -d ${POSTGRES_DB:-poslite_sandbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pos-lite-api-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-lite-api-sandbox
    restart: always
    ports:
      - "127.0.0.1:8087:8080"
    depends_on:
      pos-lite-db-sandbox:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://pos-sandbox.gdevsoftware.com,https://pos.gdevsoftware.com}
      - DATABASE_URL=jdbc:postgresql://pos-lite-db-sandbox:5432/${POSTGRES_DB:-poslite_sandbox_db}
      - DATABASE_USERNAME=${POSTGRES_USER:-pos_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-pos_password_segura}
      - JWT_SECRET=${JWT_SECRET}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MAIL_HOST=${MAIL_HOST:-smtp.resend.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-resend}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_MAIL_FROM=${SPRING_MAIL_FROM:-no-reply@gdevsoftware.com}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://gdev-eureka-server-sandbox:8761/eureka/
    networks:
      - gdev-sandbox-net

volumes:
  poslite_sandbox_db_data:

networks:
  gdev-sandbox-net:
    external: true
    name: gdev-sandbox-net
