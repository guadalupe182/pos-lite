name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]   # Solo se ejecuta cuando se actualiza main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/pos-lite-*.jar"
          target: "/home/ec2-user/"
          strip_components: 1
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop pos-lite
            cp /home/ec2-user/pos-lite-*.jar /home/ec2-user/pos-lite-0.3.0-SNAPSHOT.jar
            sudo systemctl start pos-lite
            sudo systemctl status pos-lite --no-pager
