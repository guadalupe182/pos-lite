name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/pos-lite-*.jar"
          target: "/home/ec2-user/"
          strip_components: 1
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop pos-lite
            mv /home/ec2-user/pos-lite-*.jar /home/ec2-user/pos-lite-app.jar
            chown ec2-user:ec2-user /home/ec2-user/pos-lite-app.jar
            chmod 644 /home/ec2-user/pos-lite-app.jar
            if ! grep -q "pos-lite-app.jar" /etc/systemd/system/pos-lite.service; then
              sudo sed -i 's|/home/ec2-user/pos-lite-[^ ]*\.jar|/home/ec2-user/pos-lite-app.jar|g' /etc/systemd/system/pos-lite.service
              sudo systemctl daemon-reload
            fi
            sudo systemctl start pos-lite
            sudo systemctl status pos-lite --no-pager



